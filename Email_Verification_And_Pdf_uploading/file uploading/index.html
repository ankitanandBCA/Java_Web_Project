<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar Example</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      margin: 0;
      padding: 0;
    }
    /* Navbar CSS */
    .navbar {
      background-color: #333;
      overflow: hidden;
      width: 100%;
      position: fixed; /* always top */
      top: 0;
      left: 0;
    }
    .navbar a {
      float: left;
      display: block;
      color: white;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
    }
    .navbar a:hover {
      background-color: #575757;
    }
    /* Form container */
    .container {
      background: white;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 350px;
      margin: 100px auto; /* navbar se neeche space */
    }
    .container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    input:focus {
      border-color: #007bff;
    }
    button {
      width: 100%;
      background: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

<!-- Navbar Start -->
<div class="navbar">
  <a href="#">Home</a>
  <a href="#">Upload</a>
  <a href="view.html">View</a>
</div>
<!-- Navbar End -->

<!-- Registration Form -->
<div class="container">
  <h2>Registration</h2>
  <form  enctype="multipart/form-data" onsubmit="fileuplod(event)">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="pdf">Upload PDF</label>
      <input type="file" id="pdf" name="pdf" required>
    </div>

    <button type="submit">Register</button>
  </form>
</div>



<script>
async function fileuplod(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const file = document.getElementById("pdf").files[0];

    if (!name || !email || !file) {
        alert("Please fill all fields and select a file!");
        return;
    }

    // FormData create
    const formData = new FormData();
    formData.append("name", name);
    formData.append("email", email);
formData.append("file", file); 

    const baseurl = "http://localhost:8080/upload"; // <- yaha apna endpoint likhna

    try {
        const response = await fetch(baseurl, {
            method: "POST",
            body: formData
        });

        if (response.ok) {
            const result = await response.text(); // ya json() if backend json bhej raha ho
            alert("File uploaded successfully: ");
        } else {
            alert("Upload failed: ");
        }
    } catch (error) {
        alert("Error: " + error);
    }
}
</script>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
