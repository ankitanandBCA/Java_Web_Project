<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar & Card Example</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    /* Navbar Styling */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .navbar {
      background: #333;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .navbar ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }

    .navbar ul li {
      margin-left: 20px;
    }

    .navbar ul li a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      transition: 0.3s;
    }

    .navbar ul li a:hover {
      color: #ff9800;
    }

    /* Card Styling */
    .card {
         display: flex;
      flex-direction: column;
      width: 300px;
      background: white;
      border-radius: 8px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
      margin: 40px auto;
      overflow: hidden;
     
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-body {
      padding: 15px;
    }

    .card-body h3 {
      margin: 0 0 10px;
    }

    .card-body p {
      color: #555;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .btn {
      display: inline-block;
      padding: 8px 15px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff9800;
    }
       #pdf-viewer canvas {
      display: block;
      margin: 10px auto;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body class="p-4">

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">MyWebsite</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </div>

  <!-- Card -->

<div id="cards"></div>
<div id="viewpdf"></div>

   <!-- Modal (Popup) -->
  <div class="modal fade" id="pdfModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">PDF Viewer</h5>
          <!-- ❌ Cut/Close Button -->
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="pdf-viewer" style="height:600px; overflow:auto;">
          <!-- PDF pages will be rendered here -->
        </div>
      </div>
    </div>
  </div>



<script>
  async function loadUsers() {
    // Backend se users fetch karo
    const res = await fetch("http://localhost:8080/users");
    const users = await res.json();

    let html = "";
    users.forEach(u => {
      html += `
        <div class="card">
          <div class="card-body">
            <h3>${u.name}</h3>
            <button class="btn" onclick="viewPdf(${u.id})">View PDF</button>
          </div>
        </div>
      `;
    });

    // Cards ko DOM me inject karo
    document.getElementById("cards").innerHTML = html;
  }

  
  /*  view pdf*/

   function viewPdf(id) {
  const pdfUrl = `http://localhost:8080/view/${id}`;
  // सिर्फ़ new tab में open होगा
  window.open(pdfUrl, "_blank", "noopener,noreferrer");
}





  // Page load hone ke baad users fetch karo
  loadUsers();
</script>



</body>
</html>
