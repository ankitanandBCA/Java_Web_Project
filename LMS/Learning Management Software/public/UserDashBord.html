<div class="container">
  <h2 class="mb-4">Uploaded Files</h2>
  <div class="row" id="fileList">
    <!-- Cards will be populated here -->
  </div>
</div>

<script>
  async function loadFiles() {
    try {
      const res = await fetch("http://localhost:8080/notes");
      if (!res.ok) throw new Error("Failed to fetch files");

      const files = await res.json();
      let html = "";

      files.forEach(file => {
        const fileName = file.name || "Unnamed File";

        html += `
          <div class="col-md-3 mb-4">
            <div class="card h-100">
              <div class="card-body d-flex flex-column justify-content-between">
                <h5 class="card-title text-truncate">${file.name}</h5>
                <button class="btn btn-primary btn-sm mt-2" onclick="viewPdf(${file.id})">View PDF</button>
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById("fileList").innerHTML = html;

    } catch (error) {
      console.error(error);
      document.getElementById("fileList").innerHTML = `<p class="text-danger">Failed to load files</p>`;
    }
  }

  function viewPdf(id) {
    const pdfUrl = `http://localhost:8080/view/${id}`;
    window.open(pdfUrl, "_blank", "noopener,noreferrer");
  }

  loadFiles();
</script>
