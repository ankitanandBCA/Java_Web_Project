<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users Table</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    padding: 30px;
    background-color: #f8f9fa;
  }
  table th, table td {
    vertical-align: middle;
  }
</style>
</head>
<body>

<div class="container">
  <h2 class="mb-4">Registered Users</h2>
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>Id</th>
        <th>Email</th>
        <th>Password</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="userTableBody">
      <!-- Data will be populated here -->
    </tbody>
  </table>
</div>

<script>
  
document.addEventListener("DOMContentLoaded", function() {
    const tableBody = document.getElementById("userTableBody");

    // Backend se data fetch
    fetch("http://localhost:8080/getAdmin")
        .then(response => {
            if (!response.ok) {
                throw new Error("Network response was not ok");
            }
            return response.json();
        })
        .then(users => {
            tableBody.innerHTML = ""; // clear existing rows
            users.forEach(user => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.email}</td>
                    <td>${user.password}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="editUser(${user.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id})">Delete</button>
                    </td>
                `;

                tableBody.appendChild(row);
            });
        })
        .catch(error => {
            console.error("Error fetching users:", error);
            tableBody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Failed to load data</td></tr>`;
        });
});

// delete user
function deleteUser(id) {
    if(confirm("Are you sure you want to delete user with ID: " + id + "?")) {
        // Backend call to delete
        fetch(`http://localhost:8080/deleteAdmin/${id}`, { method: 'DELETE' })
            .then(() => location.reload())
            .catch(err => alert("Delete failed: " + err));
    }
}

</script>

</body>
</html>
