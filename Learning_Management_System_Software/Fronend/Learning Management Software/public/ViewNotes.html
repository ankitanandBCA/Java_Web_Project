<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File List</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    padding: 30px;
    background-color: #f8f9fa;
  }
  .file-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px;
    background-color: white;
    border-radius: 5px;
    margin-bottom: 10px;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>

<div class="container">
  <h2 class="mb-4">Uploaded Files</h2>
  <div id="fileList">
    <!-- Files will be populated here -->
  </div>
</div>

<script>
  async function loadFiles() {
    try {
      // Backend se files fetch karo
      const res = await fetch("http://localhost:8080/notes");
      if (!res.ok) throw new Error("Failed to fetch files");

      const files = await res.json();
      let html = "";

      files.forEach(file => {
    html += `
      <div class="card mb-3">
        <div class="card-body d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">${file.name}</h5>
          <button class="btn btn-primary btn-sm" onclick="viewPdf(${file.id})">View PDF</button>
          <button class="btn btn-danger btn-sm" onclick="deletepdf(${file.id})">Delete</button>
        </div>
      </div>
    `;
});


      // Cards ko DOM me inject karo
      document.getElementById("fileList").innerHTML = html;

    } catch (error) {
      console.error(error);
      document.getElementById("fileList").innerHTML = `<p class="text-danger">Failed to load files</p>`;
    }
  }

  // View PDF function
  function viewPdf(id) {
    const pdfUrl = `http://localhost:8080/view/${id}`;
    window.open(pdfUrl, "_blank", "noopener,noreferrer");
  }

  // delete pdf
  function deletepdf(id) {
    if(confirm("Are you sure you want to delete user with ID: " + id + "?")) {
        // Backend call to delete
        fetch(`http://localhost:8080/deletepdfss/${id}`, { method: 'DELETE' })
            .then(() => location.reload())
            .catch(err => alert("Delete failed: " + err));
    }
  }


  // Page load hone ke baad files fetch karo
  loadFiles();
</script>

</body>
</html>
