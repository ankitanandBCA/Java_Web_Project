<style>
  body {

  .sidebar {

<!-- Main Content -->
<div class="content">
  <h2>Dashboard</h2>
  <div class="row g-4 mt-3">
    <!-- Total Admin -->
    <div class="col-md-4">
      <div class="card bg-primary">
        <i class="fas fa-user-shield"></i>
        <h4>Total Admin</h4>
        <p id="totalAdmin">0</p>
      </div>
    </div>

   <script>
  async function totalAdmins() {
    try {
      const res = await fetch("http://localhost:8080/totaladmin");
      if (!res.ok) throw new Error("Failed to fetch total notes");

      const total = await res.json(); // ye number return karega
      document.getElementById("totalAdmin").innerText = total;

    } catch (error) {
      console.error(error);
      document.getElementById("totalAdmin").innerText = "0";
    }
  }

  // Page load hone par call karo
  totalAdmins();
</script>
    <!-- Total User -->
    <div class="col-md-4">

<script>
 async function totalusers() {
