<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course Cards</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg,#eef2f3,#d9e4f5);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Course container */
    #coursecard {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 cards per row */
      gap: 20px; /* space between cards */
      padding: 20px;
      max-width: 1200px;
    }

    /* Each card */
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: transform .2s ease, box-shadow .2s ease;
      text-align: center;
      width: 300px;   /* fixed width */
      height: 300px;  /* fixed height */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.12);
    }

    .course-img {
      width: 100%;
      height: 150px;
      object-fit: cover;  /* crop fit */
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .name {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 4px;
      color: #0f172a;
    }
    .title {
      font-size: .85rem;
      color: #475569;
      margin: 0 0 6px;
    }

    .price-wrap {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 4px;
      margin: 4px 0;
    }
    .currency {
      font-size: 0.9rem;
      color: #64748b;
    }
    .price {
      font-size: 1.2rem;
      font-weight: 800;
      color: #111827;
    }
    .per {
      font-size: .8rem;
      color: #64748b;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>

<!-- ...same <head> / CSS ... -->
<body>
 <div id="coursecard"></div>

<script>
 async function loadCourse() {
  try {
    const response = await fetch("http://localhost:8080/AllCoursesss");
    const courses = await response.json();

    const courseCard = document.getElementById("coursecard");
    courseCard.innerHTML = "";

    courses.forEach(courseData => {
      courseCard.innerHTML += `
        <div class="card">
          <img src="data:image/jpeg;base64,${courseData.courseImage}" 
               alt="Course Image" class="course-img">
          <h2 class="name">${courseData.instructorName} (Instructor)</h2>
          <p class="title">${courseData.courseName}</p>
          <div class="price-wrap">
            <span class="currency">₹</span>
            <span class="price">${courseData.prize}</span>
            <span class="per">/ course</span>
          </div>
          <button type="button" class="btn" onclick="ViewVideo(${courseData.id})">View Video</button>
        </div>
      `;
    });
  } catch (error) {
    console.error("Error loading course:", error);
  }
}
function ViewVideo(id) {
  window.location.href = "videos.html?courseid=" + id;
}

  

loadCourse();
</script>
</body>

</html>
