<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      height: 100vh;
      overflow-y: auto;
      border-right: 2px solid #ddd;
    }
    #video-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: auto;
      max-height: 90%;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-3 bg-light p-3" id="sidebar">
      <h4>Video List</h4>
      <ul class="list-group" id="videoList"></ul>
    </div>

    <!-- Video Player -->
    <div class="col-md-9 p-3" id="video-container">
      <video id="videoPlayer" controls>
        <source id="videoSource" src="" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>
</div>

<script>
    async function loadVideos() {
      const response = await fetch("http://localhost:8080/videos/All");
      const videos = await response.json();
      console.log("Videos from backend:", videos);  // ✅ Debug log
  
      const list = document.getElementById("videoList");
      list.innerHTML = "";
  
      videos.forEach(video => {
        const li = document.createElement("li");
        li.className = "list-group-item list-group-item-action";
        li.innerText = video.description;  // 👈 Ensure field name correct
        li.style.cursor = "pointer";
        li.onclick = () => playVideo(video.id);
        list.appendChild(li);
      });
  
      if (videos.length > 0) {
        playVideo(videos[0].id);
      }
    }
  
    function playVideo(id) {
    const videoSource = document.getElementById("videoSource");
    videoSource.src = "http://localhost:8080/videos/play/" + id;
    const player = document.getElementById("videoPlayer");
    player.load();
    player.play();
}

  
    loadVideos();
  </script>
  
</body>
</html>
