<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<style>
   

    .register-box {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      margin-left: 600px;
      margin-top: -50px;
    }

    .register-box h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group input {
      width: 100%;
      padding: 12px 40px 12px 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus {
      border-color: #4a00e0;
      outline: none;
    }

    .form-group i {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      color: #888;
    }

    .register-btn {
      width: 100%;
      padding: 12px;
      background-color: #4a00e0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .register-btn:hover {
      background-color: #3600b3;
    }

    .footer-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    .footer-link a {
      color: #4a00e0;
      text-decoration: none;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="navbar">
    <div class="logo">
   <h1> <a href="inderx.html">Medicare Plus</a  > <span><i class="fa-solid fa-plus"></i></span></h1>
    </div>
    <div class="navlink">
        <ul>
            <li><a href="admin.html">Admin</a></li>
            <li><a href="doctor.html">Doctor</a></li>
            <li><a href="user.html">User</a></li>
        </ul>
    </div>

    <div class="btn">
    <button type="button" class="btn btn-primary">Book Appoinment</button>
    </div>
</div>
<br><br><br><br><br>



  <div class="register-box">
    <h2>Register</h2>
    <form onsubmit="userreg(event)">
      <div class="form-group">
        <input type="text" id="name" placeholder="Full Name" required>
        <i class="fas fa-user"></i>
      </div>

      <div class="form-group">
        <input type="email" id="email" placeholder="Email" required>
        <i class="fas fa-envelope"></i>
      </div>

      <div class="form-group">
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <i class="fas fa-phone"></i>
      </div>

      

      <div class="form-group">
        <input type="password" id="password" placeholder=" Password" required>
        <i class="fas fa-lock"></i>
      </div>

      <button type="submit" class="register-btn">Register</button>

      <div class="footer-link">
        Already have an account? <a href="user.html">Login</a>
      </div>
    </form>
  </div>
<script>
 async function userreg(event) {
  event.preventDefault();

  const email = document.getElementById("email").value;
  const name = document.getElementById("name").value;
  const phoneNo = document.getElementById("phone").value;
  const password = document.getElementById("password").value;

  const userdata = { email, name, phoneNo, password };
  console.log(JSON.stringify(userdata));

  const baseUrl = "http://localhost:8080/user/addUser";

  try {
    const response = await fetch(baseUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify(userdata),
    });

    if (response.ok) {
      alert("Registration successful!");
      window.location.href = "user.html";
    } else {
      alert("Registration failed. Please try again.");
    }
  } catch (error) {
    alert("Registration failed. Please try again.");
    console.error(error);
  }
}

</script>
</body>
</html>
