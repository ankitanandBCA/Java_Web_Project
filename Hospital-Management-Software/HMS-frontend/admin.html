<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<style>
    
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      margin-left: 600px;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 12px 40px 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }

    .input-group input:focus {
      outline: none;
      border-color: #3c8ce7;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      color: #888;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #3c8ce7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .login-btn:hover {
      background-color: #2b6bcf;
    }

    .footer-text {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    .footer-text a {
      color: #3c8ce7;
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
</style>

</head>
<body>
  <div class="navbar">
    <div class="logo">
 <h1> <a href="inderx.html">Medicare Plus</a  > <span><i class="fa-solid fa-plus"></i></span></h1>
    </div>
    <div class="navlink">
        <ul>
            <li><a href="admin.html">Admin</a></li>
            <li><a href="doctor.html">Doctor</a></li>
            <li><a href="user.html">User</a></li>
        </ul>
    </div>

    <div class="btn">
    <button type="button" class="btn btn-primary">Book Appoinment</button>
    </div>
</div>


<!-- from  -->
 <br><br><br><br><br>
  <div class="login-box">
    <h2>Login</h2>
    <form onsubmit="handleSubmit(event)">
      <div class="input-group">
        <input type="email" id="userId" placeholder="Email enter" required>
        <i class="fas fa-envelope"></i>
      </div>

      <div class="input-group">
        <input type="password" id="password" placeholder="Password enetr" required>
        <i class="fas fa-lock"></i>
      </div>

      <button type="submit" class="login-btn" >Login</button>

    </form>
  </div>
<script src="admin.js"></script>
</body>
</html>
