<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 15px;
      padding: 30px 25px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 10px;
      color: #1e293b;
    }

    p {
      text-align: center;
      color: #64748b;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #334155;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 16px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.2);
      outline: none;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
      margin-right: 10px;
    }
    .btn-primary:hover { background: #2563eb; transform: translateY(-2px); }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
    }
    .btn-secondary:hover { background: #e2e8f0; transform: translateY(-2px); }

    #status {
      margin-top: 18px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Login</h1>
    <p>Enter your credentials to continue</p>

    <form id="loginForm" novalidate onsubmit=" login(event)">
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>

      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password" minlength="6" required />
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Login</button>
        <button type="reset" class="btn btn-secondary">Clear</button>
      </div>
      <a href="UserRegistraction.html">Don't have a account plz Register</a>

    </form>

      
  </div>

  <script>
     async function login(event) {
  event.preventDefault();


  const email = document.getElementById("email").value;
 
  const password = document.getElementById("password").value;

  const userdata = { email, password };

  console.log(JSON.stringify(userdata));

  const userURL = "http://localhost:8080/LoginUser";

  try {
    const response = await fetch(userURL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(userdata)
    });

    if (response.ok) {
      alert("Login successful");
      window.location.href="UserDashBoard.html"
    } else {
      alert("Login failed");
    }
  } catch (error) {
    alert("Error: " + error.message);
  }
}
</script>
</body>
</html>
