<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HouseHunting Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background: #f5f6fa;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      display: flex;
      flex-direction: column;
      padding: 20px 15px;
    }

    /* Logo */
    .logo {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    /* Nav links */
    .nav-links {
      list-style: none;
      flex-grow: 1;
    }

    .nav-links li {
      margin: 12px 0;
    }

    .nav-links a {
      display: block;
      text-decoration: none;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .nav-links a:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }

    /* Logout fixed bottom */
    .logout {
      margin-top: auto;
    }

    /* Content area */
    .content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .content h1 {
      color: #333;
      margin-bottom: 20px;
    }

    /* Card Section */
    .card-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0px 10px 20px rgba(0,0,0,0.2);
    }

    .card h2 {
      font-size: 22px;
      color: #444;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 28px;
      font-weight: bold;
      color: #667eea;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">🏠 HouseHunting</div>
    <ul class="nav-links">
      <li><a href="AddAdmin.html">➕ Add Admin</a></li>
      <li><a href="ViewAdmin.html">👨‍💼 View Admin</a></li>
      <li><a href="ViewLandlord.html">🏘️ View Landlord</a></li>
      <li><a href="viewroomsByAdmin.html">🛏️ View Room</a></li>
      <li><a href="ViewUser.html">👥 View User</a></li>
    </ul>
    <div class="logout">
      <a href="index.html">🚪 Logout</a>
    </div>
  </div>

  <!-- Main content -->
  <div class="content">
    <h1>Dashboard Overview</h1>

    <!-- Card Section -->
    <div class="card-section">
      <div class="card">
        <h2>Total Admin</h2>
        <p id="totaladmindata">Loading...</p>
      </div>
      <div class="card">
        <h2>Total Landlord</h2>
        <p id="totallandloard">Loading...</p>
      </div>
      <div class="card">
        <h2>Total Room</h2>
        <p id="totalroom">Loading...</p>
      </div>
      <div class="card">
        <h2>Total User</h2>
        <p id="totaluser">Loading...</p>
      </div>
    </div>
  </div>

 <script>
  // Admin total fetch
  async function loadAdminTotal() {
    try {
      const response = await fetch("http://localhost:8080/TotalAdmin");
      const data = await response.json();
      document.getElementById("totaladmindata").innerText = data;
    } catch (error) {
      console.error("Error fetching total admin:", error);
    }
  }

  // Landlord total fetch
  async function loadLandlordTotal() {
    try {
      const response = await fetch("http://localhost:8080/TotalLandLoard");
      const data = await response.json();
      document.getElementById("totallandloard").innerText = data;
    } catch (error) {
      console.error("Error fetching total landlord:", error);
    }
  }
   
  // total room fetch
  async function totalroomalldata()
  {
    try {
        const response =await fetch("http://localhost:8080/TotalRoom");
        const data =await response.json();
        const total=document.getElementById("totalroom")
        total.innerText=data
        
    } catch (error) {
        console.error("Error fetching total landlord:", error);
    }
  }

  // total user count
  async function totaluserss() {

    try {
         const response =await fetch("http://localhost:8080/TotalUsers");
         const data =await response.json();
         document.getElementById("totaluser").innerText=data
    } catch (error) {
         console.error("Error fetching total landlord:", error);
    }
    
  }
  

  // Load all on page load
  window.onload = function() {
    loadAdminTotal();
    loadLandlordTotal();
    totalroomalldata();
    totaluserss();
  }
</script>
</body>
</html>
