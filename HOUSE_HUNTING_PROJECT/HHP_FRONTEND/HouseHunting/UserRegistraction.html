<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Page</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: #fff;
      border-radius: 16px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 8px;
      color: #1e293b;
    }

    p {
      text-align: center;
      color: #64748b;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #334155;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 16px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    textarea { min-height: 90px; resize: vertical; }

    input:focus, textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.2);
      outline: none;
    }

    small {
      display: block;
      margin-top: -10px;
      margin-bottom: 14px;
      color: #6b7280;
      font-size: 0.8rem;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-primary:hover { background: #2563eb; transform: translateY(-2px); }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
    }
    .btn-secondary:hover { background: #e2e8f0; transform: translateY(-2px); }

    #status {
      margin-top: 18px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Registration</h1>
    <p>Fill the details below to create your account</p>

    <form id="regForm" onsubmit="reg(event)">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Your full name" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required />

      <label for="mobile">Mobile No</label>
      <input id="mobile" name="mobile" type="number" placeholder="10-digit mobile number" pattern="^[6-9]\\d{9}$" required />
      <small>Must start with 6-9 and have 10 digits.</small>

      <label for="address">Address</label>
      <textarea id="address" name="address" placeholder="House No, Street, City, State, Pincode" required></textarea>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Create a password" minlength="6" required />
      <small>Minimum 6 characters.</small>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Register</button>
        <button type="reset" class="btn btn-secondary">Clear</button>
        
      </div>
      <a href="UserLogin.html">all ready have a account plz Login</a>
    </form>
<script>
     async function reg(event) {
  event.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const mobile = document.getElementById("mobile").value;
  const address = document.getElementById("address").value;
  const password = document.getElementById("password").value;

  const userdata = { name, email, mobile, address, password };

  console.log(JSON.stringify(userdata));

  const userURL = "http://localhost:8080/AddUser";

  try {
    const response = await fetch(userURL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(userdata)
    });

    if (response.ok) {
      alert("Registration successful");
    } else {
      alert("Registration failed");
    }
  } catch (error) {
    alert("Error: " + error.message);
  }
}
</script>
  </div>
</body>
</html>
