<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Table with Back Button</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      width: 100%;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .back-btn:hover {
      background: #2980b9;
    }

    .search-box {
      margin: 10px 0 20px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #3498db;
      color: white;
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Back Button -->
  <button class="back-btn" onclick="back()">⬅ Back</button>

  <!-- Search Box -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by Mobile Number" class="form-control" onkeyup="filterTable()">
  </div>

  <!-- Simple Table -->
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Address</th>
      <th>Mobile</th>
      <th>Image</th>
      <th>PropertyStatus</th>
      <th>Price</th>
      <th>Action</th>
    </tr>
   </thead>

   <tbody id="body">

   </tbody>
  </table>
   
<!-- EDIT POPUP MODAL -->
<div id="editModal" 
     style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
            background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center;">
  <div style="background:white; padding:20px; border-radius:8px; width:300px; text-align:center;">
    <h3>Edit Property Status</h3>
    <input type="hidden" id="editId">

    <label for="editStatus">Property Status:</label>
    <select id="editStatus" style="width:100%; padding:8px; margin:10px 0;">
      <option value="not-sold">Not Sold</option>
      <option value="sold">Sold</option>
    </select>

    <br>
    <button class="btn btn-primary"  onclick="saveStatus()">Save</button>
    <button class="btn btn-danger" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
function back() {
    window.location.href="LandLoardDashBoard.html";
}

async function onloadData() {
    const baseurlData = "http://localhost:8080/AllRooms";

    const response = await fetch(baseurlData);
    const data = await response.json();

    const tbody = document.getElementById("body");
    tbody.innerHTML = '';

    data.forEach(element => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${element.id}</td>
            <td>${element.name}</td>
            <td>${element.email}</td>
            <td>${element.address}</td>
            <td>${element.mobile}</td>
            <td>
                <img src="data:image/jpeg;base64,${element.image}" 
                     width="100" height="80" />
            </td>
            <td>${element.propertyStutas}</td>
            <td>${element.price}</td>
            <td>
                <button class="btn btn-primary" onclick="edit(${element.id})">Edit</button>
                <button class="btn btn-danger" onclick="deleteRoom(${element.id})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

window.onload = onloadData;

// Filter Table by Mobile
function filterTable() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const rows = document.querySelectorAll("#body tr");

    rows.forEach(row => {
        const mobile = row.children[4].innerText.toLowerCase();
        if (mobile.includes(input)) {
            row.style.display = "";
        } else {
            row.style.display = "none";
        }
    });
}

// update data
function edit(id) {
    const modal = document.getElementById("editModal");
    const row = document.querySelector(`button[onclick="edit(${id})"]`).closest("tr");
    const currentStatus = row.children[6].innerText;

    document.getElementById("editId").value = id;
    document.getElementById("editStatus").value = currentStatus.toLowerCase();

    modal.style.display = "flex";
}

function closeModal() {
    document.getElementById("editModal").style.display = "none";
}

async function saveStatus() {
    const id = document.getElementById("editId").value;
    const newStatus = document.getElementById("editStatus").value;

    const formData = new FormData();
    formData.append("propertyStutas", newStatus);

    const response = await fetch(`http://localhost:8080/UpdateStatus/${id}`, {
        method: "PUT",
        body: formData
    });

    if (response.ok) {
        alert("Status updated successfully!");
        closeModal();
        onloadData(); // Refresh table
    } else {
        alert("Failed to update status");
    }
}

// delete data
async function deleteRoom(id) {
    const ddeleteurl = `http://localhost:8080/delete/${id}`;
    const response = await fetch(ddeleteurl, {
        method: "DELETE",
        headers: {
            "Content-Type": "application/json"
        }
    });

    if (response.ok) {
        alert("Room Deleted");
        onloadData();
    } else {
        alert("Room not deleted");
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
