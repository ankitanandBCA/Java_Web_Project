<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LandLord Registration Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background-color: white;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #444;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #4CAF50;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #43a047;
    }

    @media screen and (max-width: 500px) {
      .container {
        margin: 20px;
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>LandLoard Registration</h2>
    <form onsubmit="landloardreg(event)">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="address">Address</label>
      <input type="text" id="address" name="address" required>

      <label for="aadhar">Aadhar Number</label>
      <input type="number" id="aadhar" name="aadhar" required minlength="12" maxlength="12">

      <label for="mobile">Mobile Number</label>
      <input type="number" id="mobile" name="mobile" required minlength="10" maxlength="10">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Register</button>
      <a href="LoginLandLoard.html">Login Page</a>
    </form>
  </div>

  <script>
    async function landloardreg(event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const address = document.getElementById("address").value;
      const aadhar = document.getElementById("aadhar").value;
      const mobile = document.getElementById("mobile").value;
      const password = document.getElementById("password").value;

      const userData = {
        name,
        email,
        address,
        aadhar,
        mobile,
        password
      };

      console.log("Sending user data:", userData);

      const url = "http://localhost:8080/AddLandLoard";

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(userData)
        });

        if (response.ok) {
          alert("Registration successful!");
          window.location.href="LoginLandLoard.html"
        } else {
          alert("Registration failed.");
        }
      } catch (error) {
        alert("Error: " + error.message);
      }
    }
  </script>

</body>
</html>
