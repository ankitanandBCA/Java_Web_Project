<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease-in-out;
    }

    .top-btn {
      display: block;
      margin-bottom: 20px;
      text-align: center;
    }

    .top-btn a {
      display: inline-block;
      padding: 8px 16px;
      background: #667eea;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    .top-btn a:hover {
      background: #5a67d8;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
      transition: 0.3s;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 6px rgba(102,126,234,0.5);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #5a67d8, #6b46c1);
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Button -->
    <div class="top-btn">
      <a href="AdminDashBoard.html">⬅ Back to Dashboard</a>
    </div>

    <h2>Register</h2>
    <form onsubmit="adminreg(event)">
      <div class="form-group">
        <input type="text" name="name" id="name" placeholder="Full Name" required>
      </div>
      <div class="form-group">
        <input type="email" name="email" id="email" placeholder="Email" required>
      </div>
      <div class="form-group">
        <input type="password" id="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit">Register</button>
    </form>
  </div>

  <script>
   async function adminreg(event){
        event.preventDefault();
        const name=document.getElementById("name").value;
        const email=document.getElementById("email").value;
        const password=document.getElementById("password").value;

        const admindatas={name,email,password};
        console.log(JSON.stringify(admindatas));

        const adminurls="http://localhost:8080/AddAdmin";
        try {
            const response=await fetch(adminurls,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(admindatas) 
            });
            if(response.ok)
            {
                alert("Registration Successful ✅");
                window.location.href="AdminDashBoard.html";
            }
            else{
                alert("Admin Registration Failed ❌");
            }
        } catch (error) {
            alert("Error: " + error);
        }
    }
  </script>
</body>
</html>
